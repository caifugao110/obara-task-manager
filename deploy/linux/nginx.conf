map $http_upgrade $obara_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /var/www/obara-task-manager;
    index index.html;
    charset utf-8;
    client_max_body_size 25m;

    # ---------- 静态资源压缩 ----------
    # JS/CSS 文本 gzip 后通常只剩 1/3 左右，弱网/跨网访问时首屏差异最明显。
    # 这里只开 gzip（nginx 自带模块）；若已编译 ngx_brotli，可再加
    #   brotli on; brotli_comp_level 5; brotli_types ...;
    # 未安装该模块时写 brotli 指令会导致 nginx 启动失败，故默认注释。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 带 hash 的构建产物：内容不变则文件名不变，可长期强缓存，二次访问直接命中本地缓存。
    # 用 ^~ 阻断后续正则 location 的优先级覆盖。
    # 只写 add_header 而不用 expires，避免 nginx 同时输出两条 Cache-Control。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 根目录静态图片/字体：文件名不带 hash，给较短的缓存期，兼顾更新。
    # 这里用 expires（会自动带出 Cache-Control: max-age），不再叠 add_header。
    location ~* \.(png|ico|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
    }

    # 入口 HTML 必须不缓存：否则发版后用户仍拿到旧的 index.html，引用不到新的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 与 WebSocket 用 ^~ 前缀匹配，避免被上面的静态文件正则 location 抢走
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $obara_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
