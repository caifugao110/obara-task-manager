# =============================================================================
# Obara Task Manager - WeKnora 知识库服务（精简版）
#
# 源自 https://github.com/Tencent/WeKnora v0.8.2 官方 docker-compose.yml，
# 只保留本系统实际使用的 5 个服务：
#   frontend  WeKnora 管理控制台（默认 http://localhost）
#   app       WeKnora 后端 API（默认 http://localhost:8080，供本系统后端代理调用）
#   docreader 文档解析服务（gRPC 50051，仅容器网络内部访问）
#   postgres  数据库 + 向量检索（paradedb/paradedb，RETRIEVE_DRIVER=postgres）
#   redis     任务队列与缓存
#
# 说明：
#   - 全部使用官方预构建镜像，无需本地构建；
#   - 配置项全部来自同目录 .env（由 .env.example 生成，脚本可自动补齐密钥）；
#   - 数据持久化在命名卷 postgres-data / data-files / docreader-tmp，
#     compose 项目名取本目录名（weknora），与原 E:\My Trae\WeKnora 部署
#     的卷名一致，可无缝复用已有数据。
# =============================================================================

services:
  frontend:
    image: wechatopenai/weknora-ui:${WEKNORA_VERSION:-latest}
    container_name: WeKnora-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_SKILL_BUNDLE_SIZE_MB=${MAX_SKILL_BUNDLE_SIZE_MB:-256}
      - APP_HOST=app
      - APP_PORT=8080
      - APP_SCHEME=http
    depends_on:
      app:
        condition: service_healthy
    networks:
      - WeKnora-network
    restart: unless-stopped

  app:
    image: wechatopenai/weknora-app:${WEKNORA_VERSION:-latest}
    container_name: WeKnora-app
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config/config.yaml:/app/config/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - .env
    environment:
      # ---------- 运行时基础 ----------
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - GIN_MODE=${GIN_MODE:-release}
      - TZ=${TZ:-Asia/Shanghai}
      - WEKNORA_LANGUAGE=${WEKNORA_LANGUAGE:-zh-CN}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-false}
      # ---------- 数据库 ----------
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-}
      # ---------- Redis ----------
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # ---------- 检索引擎（postgres = paradedb 向量检索）----------
      - RETRIEVE_DRIVER=${RETRIEVE_DRIVER:-postgres}
      # ---------- 文档解析 ----------
      - DOCREADER_ADDR=${DOCREADER_ADDR:-docreader:50051}
      - DOCREADER_TRANSPORT=grpc
      # ---------- 文件存储（容器内本地卷）----------
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - LOCAL_STORAGE_BASE_DIR=/data/files
      # ---------- 安全密钥（必须设置，见 .env）----------
      - JWT_SECRET=${JWT_SECRET:-}
      - SYSTEM_AES_KEY=${SYSTEM_AES_KEY:-}
      # ---------- 其他 ----------
      - CONCURRENCY_POOL_SIZE=${CONCURRENCY_POOL_SIZE:-5}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      docreader:
        condition: service_healthy
    networks:
      - WeKnora-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  docreader:
    image: wechatopenai/weknora-docreader:${WEKNORA_VERSION:-latest}
    container_name: WeKnora-docreader
    # gRPC 50051 只给 app 容器用，不发布到宿主机
    expose:
      - "50051"
    volumes:
      - docreader-tmp:/tmp/docreader
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DOCREADER_IMAGE_OUTPUT_DIR=/tmp/docreader
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - WeKnora-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: paradedb/paradedb:v0.22.6-pg17
    container_name: WeKnora-postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - WeKnora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 1m

  redis:
    image: redis:7.0-alpine
    container_name: WeKnora-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - WeKnora-network
    restart: always

networks:
  WeKnora-network:
    driver: bridge

volumes:
  postgres-data:
  data-files:
  docreader-tmp:
