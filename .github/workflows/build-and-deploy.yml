name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'control/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/build-and-deploy.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      control: ${{ steps.filter.outputs.control }}
      docs: ${{ steps.filter.outputs.docs }}
      is_tag: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            control:
              - 'control/**'
            docs:
              - 'README.md'
              - 'docs/**'
              - '.github/workflows/build-and-deploy.yml'

  build-control:
    name: Build Control EXE
    needs: detect-changes
    if: needs.detect-changes.outputs.control == 'true' || needs.detect-changes.outputs.is_tag == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.generate_version.outputs.version }}
      changelog: ${{ steps.generate_changelog.outputs.changelog }}
      created: ${{ steps.create_tag.outputs.created }}
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate dynamic version
        id: generate_version
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
              $version = "${{ github.ref_name }}"
          } else {
              $date = Get-Date -Format "yyyy.MM.dd"
              $baseVersion = "v$date-beta"
              $existingTags = git ls-remote --tags --refs origin "$baseVersion*"
              $buildCount = 1
              while ($existingTags -like "*$baseVersion-$buildCount*") {
                  $buildCount++
              }
              $version = "$baseVersion-$buildCount"
          }
          Write-Host "Generated version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate changelog for latest commit
        id: generate_changelog
        run: |
          # Latest commit subject and body
          $commitSubject = git log -1 --format="%s" HEAD
          $commitBody    = git log -1 --format="%b" HEAD

          Write-Host "Latest commit: $commitSubject"

          # Build changelog
          $sb = New-Object System.Text.StringBuilder
          [void]$sb.AppendLine("## 本次更新详情")
          [void]$sb.AppendLine("")
          [void]$sb.AppendLine($commitSubject)
          if ($commitBody -and $commitBody.Trim()) {
              [void]$sb.AppendLine("")
              [void]$sb.AppendLine($commitBody.Trim())
          }

          $changelog = $sb.ToString()
          $changelog = $changelog -replace "`r`n", "`n"
          if (-not $changelog) {
              $changelog = "- No changes to report"
          }
          Write-Host "Changelog:"
          Write-Host $changelog
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "changelog<<EOF`n", [System.Text.Encoding]::UTF8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$changelog`n", [System.Text.Encoding]::UTF8)
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "`nEOF`n", [System.Text.Encoding]::UTF8)

      - name: Verify .NET Framework 4.8
        run: |
          Write-Host "Checking .NET Framework 4.8..."
          $path = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          if (Test-Path $path) {
            Write-Host ".NET Framework 4.8 found."
          } else {
            Write-Host "ERROR: .NET Framework 4.8 not found."
            exit 1
          }
          $msbuildPath = Join-Path $path "MSBuild.exe"
          if (Test-Path $msbuildPath) {
            Write-Host "MSBuild found at: $msbuildPath"
          }

      - name: Build Release
        run: |
          $msbuildPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\MSBuild.exe"
          if (-not (Test-Path $msbuildPath)) {
            Write-Host "ERROR: MSBuild not found"
            exit 1
          }
          $version = "${{ steps.generate_version.outputs.version }}"
          $infoVersion = $version -replace '^v', ''
          $versionNum = ($infoVersion -replace '-.*$', '') -split '\.'
          $assemblyVersion = "$($versionNum[0]).$($versionNum[1]).$($versionNum[2]).0"
          Write-Host "Building with assembly version: $assemblyVersion"
          Write-Host "Building with informational version: $infoVersion"
          $assemblyInfoPath = "control\Properties\AssemblyInfo.cs"
          if (Test-Path $assemblyInfoPath) {
            Write-Host "Patching AssemblyInfo.cs with build version $assemblyVersion"
            $content = Get-Content $assemblyInfoPath -Raw
            $content = $content -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$assemblyVersion`")"
            $content = $content -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$assemblyVersion`")"
            $content = $content -replace 'AssemblyInformationalVersion\("[^"]+"\)', "AssemblyInformationalVersion(`"$infoVersion`")"
            Set-Content -Path $assemblyInfoPath -Value $content -NoNewline
          }
          cd control
          & $msbuildPath ObaraServiceController.csproj /p:Configuration=Release /t:Build /v:minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed"
            exit $LASTEXITCODE
          }
          Write-Host "Build completed successfully."
          Write-Host "Built EXE version info:"
          $exePath = "bin\Release\Obara-Task-Management-Service-Console.exe"
          if (Test-Path $exePath) {
            $exePath = (Resolve-Path $exePath).Path
            $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath)
            Write-Host "  FileVersion:     $($vi.FileVersion)"
            Write-Host "  ProductVersion: $($vi.ProductVersion)"
            Write-Host "  ProductName:     $($vi.ProductName)"
            Write-Host "  CompanyName:     $($vi.CompanyName)"
          }

      - name: Clean intermediate build artifacts
        run: |
          $objDir = "control\obj"
          if (Test-Path $objDir) {
            Write-Host "Removing intermediate build artifacts: $objDir"
            Remove-Item -Path $objDir -Recurse -Force
            Write-Host "Intermediate artifacts removed successfully."
          } else {
            Write-Host "No intermediate artifacts found (obj directory does not exist)."
          }

      - name: Zip distribution folder
        run: |
          $version = "${{ steps.generate_version.outputs.version }}"
          $outputDir = "control\bin\Release"
          if (-not (Test-Path $outputDir)) {
            Write-Host "ERROR: Build output not found"
            exit 1
          }
          Write-Host "Build outputs:"
          Get-ChildItem $outputDir | ForEach-Object {
            $size = if ($_.Length -gt 1MB) { "{0:N2} MB" -f ($_.Length / 1MB) } elseif ($_.Length -gt 1KB) { "{0:N2} KB" -f ($_.Length / 1KB) } else { "$($_.Length) B" }
            Write-Host "  $($_.Name) - $size"
          }
          Compress-Archive -Path "$outputDir\*" -DestinationPath "control\Obara-Task-Management-Service-Console_$version.zip" -Force
          Write-Host "ZIP created: Obara-Task-Management-Service-Console_$version.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obara-Task-Management-Service-Console_${{ steps.generate_version.outputs.version }}
          path: control/Obara-Task-Management-Service-Console_${{ steps.generate_version.outputs.version }}.zip
          retention-days: 30
          if-no-files-found: error

      - name: Create tag if version changed
        id: create_tag
        if: github.ref == 'refs/heads/main'
        run: |
          $version = "${{ steps.generate_version.outputs.version }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if (git ls-remote --exit-code --tags origin $version) {
              Write-Host "Tag $version already exists, skipping"
              echo "created=false" >> $env:GITHUB_OUTPUT
          } else {
              Write-Host "Creating tag $version"
              git tag $version
              git push origin $version
              Write-Host "Tag pushed successfully"
              echo "created=true" >> $env:GITHUB_OUTPUT
              echo "tag=$version" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release (on push to main)
        if: github.ref == 'refs/heads/main' && steps.create_tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          files: control/Obara-Task-Management-Service-Console_${{ steps.generate_version.outputs.version }}.zip
          name: ${{ steps.generate_version.outputs.version }}
          body: |
            **Obara-Task-Management-Service-Console** - ${{ steps.generate_version.outputs.version }}

            Obara 任务管理系统服务控制台，用于控制服务启停、监听服务状态、修改端口号与打开运行界面。

            ${{ steps.generate_changelog.outputs.changelog }}

            ---

            **Features:**
            - 服务启动 / 停止 / 重启控制
            - 实时服务状态与端口监听
            - 端口配置与持久化
            - 一键打开浏览器运行界面
            - 进程管理与依赖自动安装
            - 日志显示与配置持久化

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: control/Obara-Task-Management-Service-Console_${{ steps.generate_version.outputs.version }}.zip
          name: ${{ steps.generate_version.outputs.version }}
          body: |
            **Obara-Task-Management-Service-Console** - ${{ steps.generate_version.outputs.version }}

            Obara 任务管理系统服务控制台，用于控制服务启停、监听服务状态、修改端口号与打开运行界面。

            ${{ steps.generate_changelog.outputs.changelog }}

            ---

            **Features:**
            - 服务启动 / 停止 / 重启控制
            - 实时服务状态与端口监听
            - 端口配置与持久化
            - 一键打开浏览器运行界面
            - 进程管理与依赖自动安装
            - 日志显示与配置持久化

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create docs directory
        run: |
          mkdir -p _site
          cp README.md _site/index.md
          cp -r docs _site/docs
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
